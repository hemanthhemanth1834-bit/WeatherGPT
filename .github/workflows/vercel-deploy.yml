name: WeatherGPT Deploy and Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weathergpt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve the existing Vercel project
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          token = os.environ["VERCEL_TOKEN"]

          def api(path, query=None):
              url = "https://api.vercel.com" + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              request = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          scopes = [None]
          try:
              scopes += [team["id"] for team in api("/v2/teams").get("teams", [])]
          except Exception as exc:
              print(f"Team lookup skipped: {exc}")

          projects = {}
          for team_id in scopes:
              query = {"limit": 100}
              if team_id:
                  query["teamId"] = team_id
              try:
                  for project in api("/v9/projects", query).get("projects", []):
                      projects[project["id"]] = project
              except Exception as exc:
                  print(f"Project lookup skipped for scope {team_id or 'personal'}: {exc}")

          exact = [p for p in projects.values() if p.get("name", "").lower() == "weathergpt"]
          candidates = exact or [
              p for p in projects.values()
              if "weathergpt" in p.get("name", "").lower()
              or "weathergpt-kappa-pink" in json.dumps(p)
          ]
          if not candidates:
              print("Visible projects: " + ", ".join(sorted(p.get("name", "?") for p in projects.values())))
              sys.exit("No WeatherGPT project is visible to the VERCEL_TOKEN.")

          project = candidates[0]
          os.makedirs(".vercel", exist_ok=True)
          with open(".vercel/project.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {"projectId": project["id"], "orgId": project["accountId"]},
                  handle,
              )
          print(f"Using Vercel project: {project.get('name')}")
          PY

      - name: Deploy to Vercel production
        run: npx --yes vercel@latest deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public production API
        env:
          WEATHERGPT_URL: https://weathergpt-kappa-pink.vercel.app
        run: |
          python - <<'PY'
          import os, sys, time, requests

          base = os.environ["WEATHERGPT_URL"].rstrip("/")
          checks = [
              "/",
              "/api/health",
              "/api/platform/capabilities",
              "/api/providers/health?live=false",
              "/api/agent/tools",
              "/api/agent/engine",
              "/api/voice/status",
              "/api/weather/current?location=Pune",
              "/api/air-quality?location=Pune",
              "/api/weather/current?location=Pune&model=gfs",
              "/api/weather/current?location=Pune&model=ecmwf",
              "/api/weather/current?location=Pune&model=icon",
              "/api/locations/reverse?lat=16.5062&lon=80.6480",
              "/api/satellite/info?lat=16.5062&lon=80.6480",
              "/api/disasters/earthquakes?limit=1",
              "/api/disasters/wildfires?limit=1",
              "/api/climate/history?location=Pune&years=2",
              "/api/nwp/status",
              "/robots.txt",
              "/sitemap.xml",
          ]

          for attempt in range(18):
              try:
                  response = requests.get(base + "/api/health", timeout=10)
                  if response.status_code == 200:
                      break
              except requests.RequestException as exc:
                  print(f"Waiting for production: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Production health endpoint did not become ready.")

          failed = []
          for path in checks:
              try:
                  response = requests.get(base + path, timeout=30)
                  print(f"{response.status_code} {path}")
                  if response.status_code != 200:
                      failed.append(f"{path} -> {response.status_code}")
              except requests.RequestException as exc:
                  failed.append(f"{path} -> {exc}")

          language = requests.post(
              base + "/api/language/analyze",
              json={"text": "Vijayawada lo repu rain untunda?"},
              timeout=30,
          )
          print(f"{language.status_code} POST /api/language/analyze")
          if language.status_code != 200:
              failed.append(f"/api/language/analyze -> {language.status_code}")

          if failed:
              print("FAILED:")
              print("\n".join(failed))
              sys.exit(1)

          print("WeatherGPT production verification passed.")
          PY
