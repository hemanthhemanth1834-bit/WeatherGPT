name: WeatherGPT Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public production API
        env:
          WEATHERGPT_URL: https://weathergpt-kappa-pink.vercel.app
        run: |
          python - <<'PY'
          import os, sys, time, requests

          base = os.environ["WEATHERGPT_URL"].rstrip("/")
          checks = [
              "/",
              "/api/health",
              "/api/platform/capabilities",
              "/api/providers/health?live=true",
              "/api/agent/tools",
              "/api/agent/engine",
              "/api/voice/status",
              "/api/weather/current?location=Pune",
              "/api/air-quality?location=Pune",
              "/api/weather/current?location=Pune&model=gfs",
              "/api/weather/current?location=Pune&model=ecmwf",
              "/api/weather/current?location=Pune&model=icon",
              "/api/locations/reverse?lat=16.5062&lon=80.6480",
              "/api/satellite/info?lat=16.5062&lon=80.6480",
              "/api/disasters/earthquakes?limit=1",
              "/api/disasters/wildfires?limit=1",
              "/api/climate/history?location=Pune&years=2",
              "/api/nwp/status",
              "/robots.txt",
              "/sitemap.xml",
          ]

          for attempt in range(12):
              try:
                  response = requests.get(base + "/api/health", timeout=10)
                  if response.status_code == 200:
                      break
              except requests.RequestException as exc:
                  print(f"Waiting for production: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Production health endpoint did not become ready.")

          failed = []
          for path in checks:
              try:
                  response = requests.get(base + path, timeout=30)
                  print(f"{response.status_code} {path}")
                  if response.status_code != 200:
                      failed.append(f"{path} -> {response.status_code}")
              except requests.RequestException as exc:
                  failed.append(f"{path} -> {exc}")

          language = requests.post(
              base + "/api/language/analyze",
              json={"text": "Vijayawada lo repu rain untunda?"},
              timeout=30,
          )
          print(f"{language.status_code} POST /api/language/analyze")
          if language.status_code != 200:
              failed.append(f"/api/language/analyze -> {language.status_code}")

          if failed:
              print("FAILED:")
              print("\n".join(failed))
              sys.exit(1)

          print("WeatherGPT production verification passed.")
          PY
