name: WeatherGPT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q

  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install smoke-test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Smoke-test public production API
        env:
          WEATHERGPT_URL: https://weathergpt-kappa-pink.vercel.app
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests

          base = os.environ["WEATHERGPT_URL"].rstrip("/")
          for attempt in range(30):
              try:
                  response = requests.get(base + "/api/health", timeout=10)
                  if response.status_code == 200:
                      print(f"Production API healthy on attempt {attempt + 1}.")
                      break
              except requests.RequestException as exc:
                  print(f"Waiting for production deployment: {exc}")
              time.sleep(10)
          else:
              raise SystemExit("Production deployment did not become healthy within 5 minutes.")

          # A 200 alone is insufficient: validate the health contract before
          # running the rest of the production smoke battery.
          if "application/json" not in response.headers.get("content-type", "").lower():
              raise SystemExit("Production /api/health did not return JSON.")
          health = response.json()
          if health.get("status") != "healthy":
              raise SystemExit(f"Production health status is not healthy: {health!r}")
          if not isinstance(health.get("service"), str) or not health["service"].strip():
              raise SystemExit("Production health response is missing a service name.")
          if not isinstance(health.get("version"), str) or not health["version"].strip():
              raise SystemExit("Production health response is missing a version.")
          if not isinstance(health.get("standards"), list):
              raise SystemExit("Production health response is missing its standards list.")
          print("Production health contract passed:", health["service"], health["version"])

          checks = [
              "/",
              "/api/health",
              "/api/providers/health?live=false",
              "/api/agent/tools",
              "/api/agent/engine",
              "/api/voice/status",
              "/api/platform/capabilities",
              "/api/weather/current?location=Pune",
              "/api/air-quality?location=Pune",
              "/api/weather/current?location=Pune&model=gfs",
              "/api/weather/current?location=Pune&model=ecmwf",
              "/api/weather/current?location=Pune&model=icon",
              "/api/locations/reverse?lat=16.5062&lon=80.6480",
              "/api/satellite/info?lat=16.5062&lon=80.6480",
              "/api/disasters/earthquakes?limit=1",
              "/api/disasters/wildfires?limit=1",
              "/api/climate/history?location=Pune&years=2",
              "/api/nwp/status",
              "/robots.txt",
              "/sitemap.xml",
          ]

          failed = []
          provider_prefixes = (
              "/api/weather/current",
              "/api/air-quality",
              "/api/satellite/",
              "/api/disasters/",
              "/api/climate/",
          )
          for path in checks:
              provider_dependent = path.startswith(provider_prefixes)
              response = None
              last_error = None
              for attempt in range(2):
                  try:
                      response = requests.get(base + path, timeout=20)
                      if response.status_code in (502, 503, 429) and provider_dependent and attempt == 0:
                          print(f"Transient upstream status {response.status_code}; retrying {path}")
                          time.sleep(2)
                          continue
                      break
                  except requests.RequestException as exc:
                      last_error = exc
                      if attempt == 0:
                          time.sleep(2)
              if response is None:
                  if provider_dependent:
                      print(f"WARN upstream-backed endpoint timed out twice: {path}: {last_error}")
                      continue
                  failed.append(path)
                  print(f"FAIL {path}: {last_error}")
                  continue

              print(f"{response.status_code} {path}")
              if response.status_code == 200:
                  continue
              # A source outage is a valid, explicit API state; never require
              # the external weather/disaster provider to be online for CI.
              if provider_dependent and response.status_code in (429, 502, 503):
                  print(f"WARN provider-backed endpoint unavailable by design: {path}")
                  continue
              failed.append(path)

          if failed:
              print("FAILED:", failed)
              sys.exit(1)

          language = requests.post(
              base + "/api/language/analyze",
              json={"text": "Vijayawada lo repu rain untunda?"},
              timeout=30,
          )
          print(f"{language.status_code} POST /api/language/analyze")
          if language.status_code != 200:
              raise SystemExit("Production POST smoke check failed: /api/language/analyze")

          print("Public production API smoke checks passed.")
          print("Note: production UI/POST/WebSocket routes are protected by Vercel deployment access and are verified separately in local CI service tests.")
          PY

  service-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify local TTS and WebSocket routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              tts = client.post(
                  "/api/voice/tts",
                  json={"text": "WeatherGPT test", "language": "en"},
              )
              print("TTS:", tts.status_code, len(tts.content))
              if tts.status_code != 200 or not tts.content:
                  raise SystemExit("Local TTS smoke test failed.")

              with client.websocket_connect("/ws/alerts") as ws:
                  ws.send_text("health-check")
                  message = ws.receive_json()
                  print("WebSocket:", message)
                  if message.get("type") != "heartbeat_ack":
                      raise SystemExit("Local WebSocket smoke test failed.")
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies for browser API checks
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend for browser smoke
        run: npm run build
      - name: Install free browser test stack
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start local backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/weathergpt-api.log 2>&1 &
          python - <<'PY'
          import time
          import requests
          for _ in range(30):
              try:
                  if requests.get("http://127.0.0.1:8000/api/health", timeout=2).status_code == 200:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Local backend did not become healthy.")
          PY
      - name: Verify built UI in local browser
        run: |
          set -Ee
          trap 'status=$?; echo "Browser smoke failed (exit $status); preview log follows:"; sed -n "1,200p" /tmp/weathergpt-ui.log || true; exit "$status"' ERR
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/weathergpt-ui.log 2>&1 &
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:4173/"
          for i in range(60):
              try:
                  response = requests.get(url, timeout=2)
                  if response.status_code == 200:
                      print(f"Preview server is healthy after approximately {i + 1}s")
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              print("=== /tmp/weathergpt-ui.log ===")
              try:
                  with open("/tmp/weathergpt-ui.log", encoding="utf-8") as log:
                      print(log.read())
              except OSError as exc:
                  print("Failed to read UI log:", exc)
              raise SystemExit("Local UI preview did not become healthy within 60s.")
          PY

          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "http://127.0.0.1:4173/"
          with sync_playwright() as p:
              for browser_type in (p.chromium, p.firefox, p.webkit):
                  browser = browser_type.launch()
                  try:
                      context = browser.new_context(
                          geolocation={"latitude": 16.5062, "longitude": 80.6480},
                          permissions=["geolocation"],
                          viewport={"width": 390, "height": 844},
                      )
                      page = context.new_page()
                      severe = []
                      page.on("console", lambda msg: severe.append(msg.text) if msg.type == "error" else None)
                      page.goto(url, wait_until="load", timeout=120000)
                      if "WeatherGPT" not in page.title():
                          raise SystemExit(f"Unexpected title in {browser_type.name}: {page.title()!r}")
                      if page.locator("body").inner_text(timeout=10000).strip() == "":
                          raise SystemExit(f"Empty mobile render in {browser_type.name}")
                      if page.locator("main").count() != 1:
                          raise SystemExit(f"Missing main landmark in {browser_type.name}")
                      desktop = context.new_page()
                      desktop.set_viewport_size({"width": 1440, "height": 900})
                      desktop.goto(url, wait_until="load", timeout=120000)
                      if desktop.locator("main").count() != 1:
                          raise SystemExit(f"Desktop landmark failure in {browser_type.name}")
                      desktop.close()
                      # Browser smoke validates our built UI, not third-party provider uptime.
                      # Firefox can report a CORS/network error when Open-Meteo is unreachable in CI.
                      unexpected = [
                          msg for msg in severe
                          if "ERR_CONNECTION_REFUSED" not in msg
                          and not ("api.open-meteo.com" in msg and (
                              "Cross-Origin Request Blocked" in msg
                              or "CORS request did not succeed" in msg
                          ))
                      ]
                      if unexpected:
                          raise SystemExit(f"Browser console errors in {browser_type.name}: {unexpected[:10]}")
                      print("Browser pass:", browser_type.name)
                  finally:
                      browser.close()
          PY

      - name: Verify browser preferences persist
        run: python tests/preferences_persistence.py

      - name: Verify manual location search and no-GPS recovery
        env:
          WG_UI_URL: http://127.0.0.1:4173/
          WG_API_URL: http://127.0.0.1:8000/api
          WG_BROWSERS: chromium
        run: |
          python tests/location_search.py
          python tests/initial_load_recovery.py
          python tests/responsive_accessibility.py

  chat-visibility:
    # P0 regression: assistant messages must render readable, complete and
    # unclipped. Uses a deterministic mocked /api/chat/query (no live provider).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend for chat visibility test
        working-directory: frontend
        run: npm run build
      - name: Install free browser test stack
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start local backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/weathergpt-api.log 2>&1 &
          python - <<'PY'
          import time
          import requests
          for _ in range(30):
              try:
                  if requests.get("http://127.0.0.1:8000/api/health", timeout=2).status_code == 200:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Local backend did not become healthy.")
          PY
      - name: Run chat visibility regression (mocked API)
        run: |
          set -Ee
          trap 'status=$?; echo "Chat visibility test failed (exit $status); preview log follows:"; sed -n "1,200p" /tmp/weathergpt-chat-ui.log || true; exit "$status"' ERR
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/weathergpt-chat-ui.log 2>&1 &
          python - <<'PY'
          import time
          import requests

          url = "http://127.0.0.1:4173/"
          for i in range(60):
              try:
                  response = requests.get(url, timeout=2)
                  if response.status_code == 200:
                      print(f"Preview server is healthy after approximately {i + 1}s")
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              print("=== /tmp/weathergpt-chat-ui.log ===")
              try:
                  with open("/tmp/weathergpt-chat-ui.log", encoding="utf-8") as log:
                      print(log.read())
              except OSError as exc:
                  print("Failed to read UI log:", exc)
              raise SystemExit("Local UI preview did not become healthy within 60s.")
          PY
          # Chromium + Firefox: Playwright click/wait actionability on this
          # animated UI is not reliable under WebKit in CI (the same flows
          # pass there when driven manually). WebKit render coverage stays
          # in browser-smoke; WG_BROWSERS can still enable webkit locally.
          WG_BROWSERS=chromium,firefox           python tests/chat_visibility.py
        working-directory: frontend
      - name: Run site imagery regression (mocked providers)
        # Same servers; deterministic mocks for radar/GIBS tiles + metadata.
        run: |
          WG_BROWSERS=chromium,firefox python tests/imagery_visibility.py
        working-directory: frontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
